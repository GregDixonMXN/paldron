name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      # Race detector only on the pure packages: the sandbox tests re-exec
      # the test binary under Landlock/rlimits where TSan cannot mmap.
      - run: go test -count=1 -race ./internal/guardrail/ ./internal/schema/
      - run: go test -count=1 ./internal/sandbox/ ./cmd/guard/
      - run: go build -o guard ./cmd/guard
